[tools]
"cargo:cargo-edit" = "0.13.13"
cocogitto = "7.0.0"
lefthook = "2.1.10"
lychee = "0.24.2"
node = "26.7.0"
osv-scanner = "2.5.1"
pnpm = "11.22.0"
rust = { version = "1.97.1", components = "clippy,rustfmt" }
semgrep = "1.173.0"
taplo = "0.10.0"
trufflehog = "3.97.0"

[tasks.setup]
description = "依存パッケージ、Gitフック、開発用データを準備する"
run = [
  "pnpm install --frozen-lockfile",
  "lefthook install",
  "node --import tsx scripts/toolchain.mts prepare",
  "node --import tsx scripts/showcase-fixture.mts setup",
]

[tasks.dev]
description = "Tauriアプリを開発モードで起動する"
run = "node --import tsx scripts/native-slot.mts node --import tsx scripts/tauri-hook.mts launch-dev"

[tasks.reset]
description = "開発用データを初期状態へ戻す"
run = "node --import tsx scripts/showcase-fixture.mts reset"

[tasks.build]
description = "配布用のTauriアプリをビルドする"
run = "node --import tsx scripts/native-slot.mts pnpm exec tauri build"

[tasks.ci]
description = "全ての検査を実行する"
usage = '''
flag "--smoke" help="ネイティブテストを主要経路に限定する"
'''
run = [
  "mise run lint",
  "mise run typecheck",
  "mise run security",
  '''if [ "${usage_smoke:-false}" = "true" ]; then
    mise run test --smoke
  else
    mise run test
  fi''',
]

[tasks."install"]
description = "アプリをビルドして`/Applications`へインストールする"
depends = [ "build" ]
run = "node --import tsx scripts/install-app.mts"

[tasks."lint:docs"]
description = "ドキュメントの書式、文章、リンクを検査する"
run = [
  "pnpm exec markdownlint-cli2",
  "pnpm exec textlint README.md CONTRIBUTING.md THIRD_PARTY_NOTICES.md '.agents/**/*.md'",
  "lychee '**/*.md' '.agents/**/*.md'",
]

[tasks.lint]
description = "コード、設定、ドキュメントを検査する"
run = [
  "pnpm exec oxfmt --check .",
  "pnpm exec oxlint --type-aware --deny-warnings --report-unused-disable-directives .",
  "pnpm exec knip",
  "cargo fmt --all --check",
  "node --import tsx scripts/native-slot.mts cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "taplo fmt --check",
  "taplo check",
  "mise run lint:docs",
]

[tasks.format]
description = "フロントエンド、Rust、TOML、Markdownを整形する"
run = [ "pnpm exec oxfmt .", "cargo fmt --all", "taplo fmt", "pnpm exec markdownlint-cli2 --fix" ]

[tasks.typecheck]
description = "TypeScriptの型を検査する"
run = "pnpm exec tsc -b"

[tasks."security:code"]
description = "TypeScriptとRustの脆弱性を静的検査する"
run = "OTEL_SDK_DISABLED=true SEMGREP_SEND_METRICS=off semgrep scan --oss-only --metrics off --disable-version-check --error --strict --config p/javascript --config p/rust ."

[tasks."security:package"]
description = "依存パッケージの脆弱性と署名を検査する"
run = [
  "osv-scanner scan source --lockfile=pnpm-lock.yaml --lockfile=Cargo.lock --config=osv-scanner.toml",
  "pnpm audit --prod --audit-level high",
  "pnpm audit signatures",
]

[tasks."security:secrets"]
description = "現在のファイルとGit履歴に含まれる機密情報を検査する"
run = '''
set -eu
mkdir -p tmp/security/trufflehog-clones
rm -f tmp/security/trufflehog-filesystem.sarif tmp/security/trufflehog-git.sarif

status=0
trufflehog --no-verification --no-update --fail --fail-on-scan-errors --sarif filesystem --exclude-paths .trufflehog-exclude-paths . > tmp/security/trufflehog-filesystem.sarif || status=$?
if [ "$status" -ne 0 ] && [ "$status" -ne 183 ]; then
  exit "$status"
fi

status=0
trufflehog --no-verification --no-update --fail --fail-on-scan-errors --sarif git --exclude-paths .trufflehog-exclude-paths --clone-path tmp/security/trufflehog-clones file://. > tmp/security/trufflehog-git.sarif || status=$?
if [ "$status" -ne 0 ] && [ "$status" -ne 183 ]; then
  exit "$status"
fi

grep -h '"trufflehogFingerprint/v1"' tmp/security/trufflehog-filesystem.sarif tmp/security/trufflehog-git.sarif \
  | sed 's/.*: "\([0-9a-f]*\)".*/\1/' \
  | sort -u > tmp/security/trufflehog-fingerprints
diff -u .trufflehog-allowlist tmp/security/trufflehog-fingerprints
'''

[tasks.security]
description = "全てのセキュリティ検査を実行する"
run = [ '''if [ "$(date -u +%Y%m%d)" -ge 20260916 ]; then
    echo "セキュリティ例外の失効日を過ぎています。.trufflehog-allowlistとapp/native/src/git.rsのnosemgrep抑制を見直してください。" >&2
    exit 1
  fi''', "mise run security:code", "mise run security:package", "mise run security:secrets" ]

[tasks.test]
description = "全てのテストを実行する"
usage = '''
flag "--smoke" help="ネイティブテストを主要経路に限定する"
'''
run = [
  "mise run test:unit",
  "mise run test:integration",
  '''set -eu
  smoke_arg=
  if [ "${usage_smoke:-false}" = "true" ]; then
    smoke_arg=--smoke
  fi
  mise run test:e2e $smoke_arg
  STELLA_TEST_APP_BINARY='./target/release/Stella (E2E)' mise run test:visual-regression $smoke_arg''',
]

[tasks."test:unit"]
description = "単体テストを実行する"
run = [
  "pnpm exec vitest run",
  "node --import tsx scripts/native-slot.mts cargo test --workspace --all-targets --all-features -- --skip workspace::tests",
]

[tasks."test:integration"]
description = "統合テストを実行する"
run = "node --import tsx scripts/native-slot.mts cargo test --workspace --all-targets --all-features workspace::tests"

[tasks."test:e2e"]
description = "E2Eテストを実行する"
usage = '''
flag "--smoke" help="主要経路だけを実行する"
flag "--headless <headless>" help="ウィンドウを表示せずに実行する" default="true" {
  choices "true" "false"
}
arg "[wdio_args]" var=#true double_dash="required"
'''
run = [
  '''if [ -z "${STELLA_TEST_APP_BINARY:-}" ]; then
    VITE_E2E=true node --import tsx scripts/native-slot.mts node --import tsx scripts/mode-app.mts e2e target/release/stella pnpm exec tauri build --no-bundle --features e2e --config app/native/tauri.e2e.conf.json
  fi''',
  '''
  eval "set -- ${usage_wdio_args-}"
  STELLA_TEST_MODE=e2e STELLA_TEST_SMOKE=${usage_smoke:-false} STELLA_E2E_HEADLESS=${usage_headless?} pnpm exec wdio run wdio.conf.ts "$@"
  ''',
]

[tasks."test:visual-regression"]
description = "ビジュアルリグレッションテストを実行する"
usage = '''
flag "--smoke" help="代表画面だけを実行する"
flag "--update" help="基準画像を更新する"
'''
run = [
  '''
  if [ "${usage_smoke:-false}" = "true" ] && [ "${usage_update:-false}" = "true" ]; then
    echo "--smokeと--updateは同時に指定できません。" >&2
    exit 1
  fi
  if [ "${usage_update:-false}" != "true" ] && [ ! -d tmp/visual-regression/baseline ]; then
    echo "基準画像がありません。mise run test:visual-regression --updateを実行してください。" >&2
    exit 1
  fi
  rm -rf tmp/visual-regression/current
  ''',
  '''if [ -z "${STELLA_TEST_APP_BINARY:-}" ]; then
    VITE_E2E=true node --import tsx scripts/native-slot.mts node --import tsx scripts/mode-app.mts vrt target/release/stella pnpm exec tauri build --no-bundle --features e2e --config app/native/tauri.e2e.conf.json --config '{"productName":"Stella (VRT)","identifier":"com.emuni.stella.vrt"}'
  fi''',
  "STELLA_TEST_MODE=vrt STELLA_TEST_SMOKE=${usage_smoke:-false} STELLA_VRT_UPDATE=${usage_update:-false} STELLA_E2E_HEADLESS=true STELLA_SCREENSHOT_OUTPUT=tmp/visual-regression/current pnpm exec wdio run wdio.conf.ts",
  '''
  if [ "${usage_update:-false}" = "true" ]; then
    rm -rf tmp/visual-regression/baseline
    mv tmp/visual-regression/current tmp/visual-regression/baseline
  fi
  ''',
]

[tasks."screenshot"]
description = "スクリーンショットを生成する"
run = [
  "VITE_E2E=true node --import tsx scripts/native-slot.mts node --import tsx scripts/mode-app.mts scr target/release/stella pnpm exec tauri build --no-bundle --features e2e --config app/native/tauri.e2e.conf.json --config '{\"productName\":\"Stella (SCR)\",\"identifier\":\"com.emuni.stella.scr\"}'",
  "STELLA_TEST_MODE=scr STELLA_E2E_HEADLESS=true pnpm exec wdio run wdio.conf.ts",
]

[tasks.update]
description = "パッケージを最新にアップデートする"
run = [
  "pnpm update --latest --include-github-actions",
  "cargo upgrade --manifest-path app/native/Cargo.toml --incompatible allow --pinned allow",
  "cargo update",
]
