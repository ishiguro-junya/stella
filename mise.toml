[tools]
cocogitto = "7.0.0"
lefthook = "2.1.10"
lychee = "0.24.2"
node = "24.18.1"
pnpm = "11.21.0"
rust = { version = "1.96.0", components = "clippy,rustfmt" }
taplo = "0.10.0"

[tasks.setup]
description = "依存パッケージ、Gitフック、開発用データを準備する"
run = [
  "pnpm install --frozen-lockfile",
  "lefthook install",
  "node --import tsx scripts/toolchain.mts prepare",
  "node --import tsx scripts/showcase-fixture.mts setup",
]

[tasks.dev]
description = "Tauriアプリを開発モードで起動する"
run = "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER='node --import tsx ../scripts/mode-app.mts dev' pnpm exec tauri dev --config src-tauri/tauri.dev.conf.json"

[tasks.reset]
description = "開発用データを初期状態へ戻す"
run = "node --import tsx scripts/showcase-fixture.mts reset"

[tasks.build]
description = "配布用のTauriアプリをビルドする"
run = "pnpm exec tauri build"

[tasks."install"]
description = "アプリをビルドして`/Applications`へインストールする"
depends = [ "build" ]
run = "node --import tsx scripts/install-app.mts"

[tasks.lint]
description = "フロントエンド、Rust、設定、ドキュメント、コミット履歴を検査する"
depends = [ "lint:frontend", "lint:rust", "lint:config", "lint:docs" ]
run = "node --import tsx scripts/check-commits.mts"

[tasks."lint:frontend"]
description = "フロントエンドの書式とコードを検査する"
run = [
  "pnpm exec oxfmt --check .",
  "pnpm exec oxlint --type-aware --deny-warnings --report-unused-disable-directives .",
]

[tasks."lint:rust"]
description = "Rustの書式とコードを検査する"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
]

[tasks."lint:config"]
description = "TOMLの書式と内容を検査する"
run = [ "taplo fmt --check", "taplo check" ]

[tasks."lint:docs"]
description = "Markdownの書式、文章、リンクを検査する"
run = [
  "pnpm exec markdownlint-cli2",
  "pnpm exec textlint README.md CONTRIBUTING.md DESIGN.md THIRD_PARTY_NOTICES.md 'docs/**/*.md'",
  "lychee --files-from .lycheeinputs",
]

[tasks."lint:commit-message"]
description = "コミットメッセージがConventional Commits形式か検査する"
run = "node --import tsx scripts/verify-commit-message.mts"

[tasks.format]
description = "フロントエンド、Rust、TOML、Markdownを整形する"
run = [ "pnpm exec oxfmt .", "cargo fmt --all", "taplo fmt", "pnpm exec markdownlint-cli2 --fix" ]

[tasks.typecheck]
description = "TypeScriptの型を検査する"
run = "pnpm exec tsc -b"

[tasks.test]
description = "フロントエンドとRustのテストを実行する"
depends = [ "test:frontend", "test:rust" ]

[tasks."test:frontend"]
description = "フロントエンドの単体テストを実行する"
run = "pnpm exec vitest run"

[tasks."test:rust"]
description = "Rustの単体テストと統合テストを実行する"
run = "cargo test --workspace --all-targets --all-features"

[tasks."test:e2e"]
description = "ネイティブアプリのE2Eテストを実行する"
run = [
  "VITE_E2E=true pnpm exec tauri build --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json",
  "node --import tsx scripts/mode-app.mts test-link target/release/stella",
  "pnpm exec wdio run wdio.conf.ts",
]

[tasks."screenshot"]
description = "README用のスクリーンショットを生成する"
run = [
  "VITE_E2E=true pnpm exec tauri build --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json",
  "node --import tsx scripts/mode-app.mts test-link target/release/stella",
  "STELLA_VISUAL_QA_DIR=docs/assets pnpm exec wdio run wdio.conf.ts --spec tests/e2e/readme-screenshots.spec.ts",
]
