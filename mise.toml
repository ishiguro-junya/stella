[tools]
"cargo:cargo-edit" = "0.13.13"
cocogitto = "7.0.0"
lefthook = "2.1.10"
lychee = "0.24.2"
node = "26.7.0"
pnpm = "11.22.0"
rust = { version = "1.97.1", components = "clippy,rustfmt" }
taplo = "0.10.0"

[tasks.setup]
description = "依存パッケージ、Gitフック、開発用データを準備する"
run = [
  "pnpm install --frozen-lockfile",
  "lefthook install",
  "node --import tsx scripts/toolchain.mts prepare",
  "node --import tsx scripts/showcase-fixture.mts setup",
]

[tasks.dev]
description = "Tauriアプリを開発モードで起動する"
run = "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER='node --import tsx ../../scripts/mode-app.mts dev' pnpm exec tauri dev --config app/native/tauri.dev.conf.json"

[tasks.reset]
description = "開発用データを初期状態へ戻す"
run = "node --import tsx scripts/showcase-fixture.mts reset"

[tasks.build]
description = "配布用のTauriアプリをビルドする"
run = "pnpm exec tauri build"

[tasks.ci]
description = "全ての検査を実行する"
run = [ "mise run lint ::: typecheck ::: test", "mise run build" ]

[tasks."install"]
description = "アプリをビルドして`/Applications`へインストールする"
depends = [ "build" ]
run = "node --import tsx scripts/install-app.mts"

[tasks.lint]
description = "コード、設定、ドキュメントを検査する"
run = [
  "pnpm exec oxfmt --check .",
  "pnpm exec oxlint --type-aware --deny-warnings --report-unused-disable-directives .",
  "pnpm exec knip",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "taplo fmt --check",
  "taplo check",
  "pnpm exec markdownlint-cli2",
  "pnpm exec textlint README.md CONTRIBUTING.md DESIGN.md THIRD_PARTY_NOTICES.md 'docs/**/*.md'",
  "lychee --files-from .lycheeinputs",
]

[tasks.format]
description = "フロントエンド、Rust、TOML、Markdownを整形する"
run = [ "pnpm exec oxfmt .", "cargo fmt --all", "taplo fmt", "pnpm exec markdownlint-cli2 --fix" ]

[tasks.typecheck]
description = "TypeScriptの型を検査する"
run = "pnpm exec tsc -b"

[tasks.test]
description = "全てのテストを実行する"
run = [ "mise run test:unit", "mise run test:integration", "mise run test:e2e" ]

[tasks."test:unit"]
description = "単体テストを実行する"
run = [
  "pnpm exec vitest run",
  "cargo test --workspace --all-targets --all-features -- --skip workspace::tests",
]

[tasks."test:integration"]
description = "統合テストを実行する"
run = "cargo test --workspace --all-targets --all-features workspace::tests"

[tasks."test:e2e"]
description = "E2Eテストを実行する"
usage = '''
flag "--headless <headless>" help="ウィンドウを表示せずに実行する" default="true" {
  choices "true" "false"
}
arg "[wdio_args]" var=#true double_dash="required"
'''
run = [
  "VITE_E2E=true pnpm exec tauri build --no-bundle --features e2e --config app/native/tauri.e2e.conf.json",
  "node --import tsx scripts/mode-app.mts test-link target/release/stella",
  '''
  eval "set -- ${usage_wdio_args-}"
  STELLA_E2E_HEADLESS=${usage_headless?} pnpm exec wdio run wdio.conf.ts "$@"
  ''',
]

[tasks."screenshot"]
description = "スクリーンショットを生成する"
run = [
  "VITE_E2E=true pnpm exec tauri build --no-bundle --features e2e --config app/native/tauri.e2e.conf.json",
  "node --import tsx scripts/mode-app.mts test-link target/release/stella",
  "STELLA_E2E_HEADLESS=true STELLA_SCREENSHOT=true pnpm exec wdio run wdio.conf.ts",
]

[tasks.update]
description = "パッケージを最新にアップデートする"
run = [
  "pnpm update --latest --include-github-actions",
  "cargo upgrade --manifest-path app/native/Cargo.toml --incompatible allow --pinned allow",
  "cargo update",
]
