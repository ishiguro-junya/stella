lefthook: mise exec -- lefthook
glob_matcher: doublestar

commit-msg:
  commands:
    conventional-commit:
      run: mise run lint:commit-message -- "{1}"

pre-push:
  jobs:
    - name: quality-gates
      group:
        parallel: true
        jobs:
          - name: lint
            run: mise run lint
          - name: application
            group:
              jobs:
                - name: test
                  run: mise run test
                - name: test-e2e
                  run: mise run test:e2e
