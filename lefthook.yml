lefthook: mise exec -- lefthook
glob_matcher: doublestar

commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file "{1}"

pre-push:
  jobs:
    - name: quality-gates
      group:
        parallel: true
        jobs:
          - name: lint
            run: mise run lint
          - name: test
            run: mise run test
