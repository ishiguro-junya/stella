include = [ "**/*.toml" ]
exclude = [ ".tmp/**", "node_modules/**", "src-tauri/target/**", "target/**" ]

[formatting]
align_comments = true
align_entries = false
allowed_blank_lines = 1
array_auto_collapse = true
array_auto_expand = true
array_trailing_comma = true
column_width = 100
compact_arrays = false
compact_inline_tables = false
crlf = false
indent_entries = false
indent_string = "  "
indent_tables = false
reorder_keys = false
trailing_newline = true
