[package]
name = "stella"
version = "1.0.0-alpha.5"
description = "Stella Git client backend"
license = "SUL-1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "stella_backend"
crate-type = [ "lib", "cdylib", "staticlib" ]

[[bin]]
name = "stella"
path = "src/main.rs"

[features]
default = [  ]
custom-protocol = [ "tauri/custom-protocol" ]
e2e = [ "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver" ]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [  ] }

[dependencies]
serde = { version = "=1.0.229", features = [ "derive" ] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [ "protocol-asset" ] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = [ "rt", "sync", "time" ] }
trash = "=5.2.6"
uuid = { version = "=1.24.0", features = [ "serde", "v4" ] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
